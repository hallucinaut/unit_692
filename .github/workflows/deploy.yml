name: deploy_gh_pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# Lock down permissions at the top level
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout_repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: setup_node_env
        uses: actions/setup-node@1d429da20d2236b5a397fbe3bd51b893dd321f58 # v4.1.0
        with:
          node-version: 20
          cache: 'npm'
          check-latest: true

      - name: install_dependencies
        # npm ci is faster and more secure for CI/CD than npm install
        run: npm ci

      - name: security_audit
        # Audit dependencies for known vulnerabilities
        run: npm audit --audit-level=high

      - name: build_project
        run: npm run build
        env:
          NODE_ENV: production

      - name: upload_pages_artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dee4629af255 # v3.0.1
        with:
          path: ./dist

  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: deploy_to_pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0fedfffbda886e4 # v4.0.5