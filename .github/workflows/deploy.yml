name: deploy_gh_pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# Lock down permissions at the top level
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout_repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: setup_node_env
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          check-latest: true

      - name: install_dependencies
        # npm ci is faster and more secure for CI/CD than npm install
        run: npm ci

      - name: security_audit
        # Audit dependencies for known vulnerabilities
        run: npm audit --audit-level=high

      - name: build_project
        run: npm run build
        env:
          NODE_ENV: production

      - name: upload_pages_artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: deploy_to_pages
        id: deployment
        uses: actions/deploy-pages@v4
